<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AeroSurrogate — Interactive Wind-Tunnel Aerodynamics Figure</title>
<style>
:root, [data-theme="dark"] {
  --anatomy-bg: #0e1013;
  --anatomy-card: #13161b;
  --anatomy-paper: #13161b;
  --anatomy-rule: #2a303a;
  --anatomy-ink: #e8ecf2;
  --anatomy-muted: #8a94a4;
  --anatomy-hi: #cfd6e0;
  --anatomy-mid: #7c8798;
  --anatomy-lo: #4c5563;
  --anatomy-faint: #313844;
  --anatomy-lit: #f5f7fa;
  --anatomy-accent: #52a8ff;
  --anatomy-accent-dim: #26486b;
  --anatomy-top: #1c2129;
  --anatomy-shade-0: #191e25;
  --anatomy-shade-1: #161a21;
  --anatomy-shade-2: #12151b;
  --anatomy-shade-3: #0d1015;
  --anatomy-lit-top: #263344;
  --anatomy-lit-shade-0: #202d3d;
  --anatomy-lit-shade-1: #1a2533;
  --anatomy-lit-shade-2: #141d28;
  --anatomy-lit-shade-3: #101720;
  --anatomy-halo: rgba(0, 0, 0, 0.42);
}

[data-theme="light"] {
  --anatomy-bg: #f4f5f7;
  --anatomy-card: #ffffff;
  --anatomy-paper: #ffffff;
  --anatomy-rule: #cfd5df;
  --anatomy-ink: #14181f;
  --anatomy-muted: #5a6473;
  --anatomy-hi: #1d232c;
  --anatomy-mid: #5d6776;
  --anatomy-lo: #8e98a7;
  --anatomy-faint: #bcc4d0;
  --anatomy-lit: #0c1016;
  --anatomy-accent: #0b63ce;
  --anatomy-accent-dim: #a9c6eb;
  --anatomy-top: #f7f8fa;
  --anatomy-shade-0: #eef1f5;
  --anatomy-shade-1: #e4e8ef;
  --anatomy-shade-2: #d8dee8;
  --anatomy-shade-3: #cbd3e0;
  --anatomy-lit-top: #e8f1fc;
  --anatomy-lit-shade-0: #dce9f9;
  --anatomy-lit-shade-1: #cde0f6;
  --anatomy-lit-shade-2: #bdd6f2;
  --anatomy-lit-shade-3: #adc9ec;
  --anatomy-halo: rgba(20, 24, 31, 0.08);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--anatomy-bg);
  color: var(--anatomy-ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  -webkit-font-smoothing: antialiased;
}

body.iso {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px 16px 36px;
}

.iso-wrap {
  margin: 0;
  width: 100%;
  max-width: 820px;
}

.iso-plate {
  position: relative;
  background: var(--anatomy-card);
  border: 1px solid var(--anatomy-rule);
  border-radius: 0;
  outline: none;
  user-select: none;
}

.iso-plate:focus-visible {
  border-color: var(--anatomy-accent);
}

.iso-bar {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  padding: 10px 14px;
  font-size: 11px;
  letter-spacing: 0.03em;
  line-height: 1.35;
}

.iso-bar-top {
  border-bottom: 1px solid var(--anatomy-rule);
}

.iso-bar-bot {
  border-top: 1px solid var(--anatomy-rule);
  flex-wrap: wrap;
}

.iso-fig {
  color: var(--anatomy-muted);
  text-transform: uppercase;
  font-weight: 600;
  white-space: nowrap;
}

.iso-title {
  color: var(--anatomy-ink);
  font-weight: 600;
  text-align: right;
}

.iso-hint {
  color: var(--anatomy-muted);
}

.iso-readout {
  color: var(--anatomy-ink);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.iso-stage {
  position: relative;
  width: 100%;
  overflow: hidden;
  cursor: grab;
}

.iso-stage:active {
  cursor: grabbing;
}

.iso-svg {
  display: block;
  width: 100%;
  height: auto;
}

.iso-halo { fill: var(--anatomy-halo); stroke: none; }
.iso-fill { fill: var(--anatomy-paper); stroke: none; }
.iso-top { fill: var(--anatomy-top); stroke: none; }
.iso-shade-0 { fill: var(--anatomy-shade-0); stroke: none; }
.iso-shade-1 { fill: var(--anatomy-shade-1); stroke: none; }
.iso-shade-2 { fill: var(--anatomy-shade-2); stroke: none; }
.iso-shade-3 { fill: var(--anatomy-shade-3); stroke: none; }

.iso-solid[data-lit="1"] .iso-top { fill: var(--anatomy-lit-top); }
.iso-solid[data-lit="1"] .iso-shade-0 { fill: var(--anatomy-lit-shade-0); }
.iso-solid[data-lit="1"] .iso-shade-1 { fill: var(--anatomy-lit-shade-1); }
.iso-solid[data-lit="1"] .iso-shade-2 { fill: var(--anatomy-lit-shade-2); }
.iso-solid[data-lit="1"] .iso-shade-3 { fill: var(--anatomy-lit-shade-3); }

.iso-edge, .iso-crease, .iso-bevel, .iso-line {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.iso-edge { stroke-width: 1.05; }
.iso-solid[data-lit="1"] .iso-edge { stroke: var(--anatomy-accent); stroke-width: 1.25; }
.iso-crease { stroke-width: 0.65; }
.iso-bevel { stroke: var(--anatomy-mid); stroke-width: 0.6; opacity: 0.55; }
.iso-line { stroke-width: 0.9; }

[data-tone="hi"] { stroke: var(--anatomy-hi); }
[data-tone="mid"] { stroke: var(--anatomy-mid); }
[data-tone="lo"] { stroke: var(--anatomy-lo); }
[data-tone="faint"] { stroke: var(--anatomy-faint); }
[data-tone="lit"] { stroke: var(--anatomy-accent); }

.iso-dot { stroke: none; }
.iso-dots[data-tone="hi"] .iso-dot, .iso-dot[data-tone="hi"] { fill: var(--anatomy-hi); }
.iso-dots[data-tone="mid"] .iso-dot, .iso-dot[data-tone="mid"] { fill: var(--anatomy-mid); }
.iso-dots[data-tone="lo"] .iso-dot, .iso-dot[data-tone="lo"] { fill: var(--anatomy-lo); }
.iso-dots[data-tone="lit"] .iso-dot, .iso-dot[data-tone="lit"] { fill: var(--anatomy-accent); }

.iso-dotted { stroke-dasharray: 1.5 3; }
.iso-dashed { stroke-dasharray: 5 3.5; }

/* Interactive part highlight */

/* Seamless 3D sculpted car mesh faces (Anatomy 4-tone flat shading, zero gradients) */
.iso-mesh-face { stroke-width: 0.55; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.iso-mesh-face[data-mat="body"][data-q="top"] { fill: var(--anatomy-lit-top); stroke: var(--anatomy-lit-top); }
.iso-mesh-face[data-mat="body"][data-q="0"] { fill: var(--anatomy-lit-shade-0); stroke: var(--anatomy-lit-shade-0); }
.iso-mesh-face[data-mat="body"][data-q="1"] { fill: var(--anatomy-lit-shade-1); stroke: var(--anatomy-lit-shade-1); }
.iso-mesh-face[data-mat="body"][data-q="2"] { fill: var(--anatomy-lit-shade-2); stroke: var(--anatomy-lit-shade-2); }
.iso-mesh-face[data-mat="body"][data-q="3"] { fill: var(--anatomy-lit-shade-3); stroke: var(--anatomy-lit-shade-3); }

.iso-mesh-face[data-mat="glass"][data-q="top"] { fill: var(--anatomy-shade-1); stroke: var(--anatomy-shade-1); }
.iso-mesh-face[data-mat="glass"][data-q="0"] { fill: var(--anatomy-shade-2); stroke: var(--anatomy-shade-2); }
.iso-mesh-face[data-mat="glass"][data-q="1"] { fill: var(--anatomy-shade-2); stroke: var(--anatomy-shade-2); }
.iso-mesh-face[data-mat="glass"][data-q="2"] { fill: var(--anatomy-shade-3); stroke: var(--anatomy-shade-3); }
.iso-mesh-face[data-mat="glass"][data-q="3"] { fill: var(--anatomy-shade-3); stroke: var(--anatomy-shade-3); }

.iso-mesh-face[data-mat="trim"][data-q="top"] { fill: var(--anatomy-shade-0); stroke: var(--anatomy-shade-0); }
.iso-mesh-face[data-mat="trim"][data-q="0"] { fill: var(--anatomy-shade-1); stroke: var(--anatomy-shade-1); }
.iso-mesh-face[data-mat="trim"][data-q="1"] { fill: var(--anatomy-shade-2); stroke: var(--anatomy-shade-2); }
.iso-mesh-face[data-mat="trim"][data-q="2"] { fill: var(--anatomy-shade-3); stroke: var(--anatomy-shade-3); }
.iso-mesh-face[data-mat="trim"][data-q="3"] { fill: var(--anatomy-shade-3); stroke: var(--anatomy-shade-3); }

.iso-mesh-face[data-mat="accent"] { fill: var(--anatomy-accent); stroke: var(--anatomy-accent); }
.iso-car-feature { fill: none; stroke: var(--anatomy-accent); stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.iso-car-crease { fill: none; stroke: var(--anatomy-mid); stroke-width: 0.7; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; opacity: 0.75; }

.iso-part-group { cursor: pointer; }
.iso-part-group.is-hovered .iso-edge { stroke: var(--anatomy-accent); stroke-width: 1.45; }

/* Controls & telemetry panel (flat, 1px ruled, no glow/gradients/rounded corners) */
.iso-panel {
  border: 1px solid var(--anatomy-rule);
  border-top: none;
  background: var(--anatomy-card);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.iso-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.iso-seg {
  display: inline-flex;
  border: 1px solid var(--anatomy-rule);
}

.iso-btn {
  appearance: none;
  background: transparent;
  color: var(--anatomy-muted);
  border: none;
  border-right: 1px solid var(--anatomy-rule);
  padding: 6px 10px;
  font: inherit;
  font-size: 11px;
  cursor: pointer;
  line-height: 1.2;
}

.iso-btn:last-child { border-right: none; }
.iso-btn:hover { color: var(--anatomy-ink); }
.iso-btn[aria-pressed="true"], .iso-btn.is-active {
  background: var(--anatomy-accent);
  color: #ffffff;
}
[data-theme="dark"] .iso-btn[aria-pressed="true"],
[data-theme="dark"] .iso-btn.is-active {
  color: #0b0e12;
  font-weight: 600;
}

.iso-btn-solo {
  border: 1px solid var(--anatomy-rule);
}

.iso-sliders {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.iso-ctrl {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.iso-ctrl-head {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--anatomy-muted);
}

.iso-ctrl-val {
  color: var(--anatomy-ink);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.iso-range {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 2px;
  background: var(--anatomy-rule);
  outline: none;
  margin: 6px 0;
}

.iso-range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  background: var(--anatomy-accent);
  border: 1px solid var(--anatomy-card);
  cursor: pointer;
}

.iso-range::-moz-range-thumb {
  width: 12px;
  height: 12px;
  background: var(--anatomy-accent);
  border: 1px solid var(--anatomy-card);
  border-radius: 0;
  cursor: pointer;
}

.iso-metrics {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  border-top: 1px solid var(--anatomy-rule);
  padding-top: 10px;
  gap: 8px;
}

.iso-metric {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.iso-metric-k {
  font-size: 10px;
  color: var(--anatomy-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.iso-metric-v {
  font-size: 12px;
  font-weight: 600;
  color: var(--anatomy-ink);
  font-variant-numeric: tabular-nums;
}

.iso-metric-sub {
  font-size: 10px;
  color: var(--anatomy-muted);
}

.iso-inspect {
  font-size: 11px;
  color: var(--anatomy-muted);
  border-top: 1px solid var(--anatomy-rule);
  padding-top: 8px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

.iso-inspect strong {
  color: var(--anatomy-ink);
}

.iso-foot {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.iso-keys {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 11px;
  color: var(--anatomy-muted);
}

.iso-key {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.iso-mark {
  display: inline-block;
  width: 12px;
  height: 10px;
  border: 1px solid var(--anatomy-mid);
  background: var(--anatomy-top);
}

.iso-mark-lit {
  border-color: var(--anatomy-accent);
  background: var(--anatomy-lit-top);
}

.iso-mark-mid {
  border-color: var(--anatomy-mid);
  background: var(--anatomy-shade-1);
}

.iso-mark-lo {
  border-color: var(--anatomy-lo);
  background: var(--anatomy-shade-3);
}

.iso-mark-fast {
  height: 2px;
  border: none;
  background: var(--anatomy-accent);
}

.iso-mark-wake {
  height: 2px;
  border: none;
  border-top: 2px dashed var(--anatomy-lo);
  background: transparent;
}

.iso-caption {
  margin: 0;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--anatomy-muted);
}

@media (max-width: 600px) {
  body.iso { padding: 10px 8px 24px; }
  .iso-bar { padding: 8px 10px; font-size: 10px; }
  .iso-sliders { grid-template-columns: 1fr; gap: 10px; }
  .iso-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .iso-panel { padding: 10px; }
  .iso-btn { padding: 6px 8px; font-size: 10.5px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>

<script>/**
 * Anatomy-compatible Isometric Drawing Kit (kit/iso-kit.mjs)
 * Implements the core Anatomy projection, 4-tone shaded solids, face lines, parts library,
 * SVG string renderers, card/plate framing, and --anatomy-* theme tokens (dark & light).
 */

const DEG = Math.PI / 180;

function r1(n) {
  return Math.round(n * 10) / 10;
}

function cameraOf(P) {
  const a = (P.azimuth ?? 45) * DEG;
  const e = (P.elevation ?? 30) * DEG;
  const ca = Math.cos(a), sa = Math.sin(a);
  const ce = Math.cos(e), se = Math.sin(e);
  return { ca, sa, ce, se, a, e };
}

function iso(pt, P) {
  const { ca, sa, ce, se } = cameraOf(P);
  const [x, y, z] = pt;
  const k = P.scale ?? 1;
  const [ox, oy] = P.origin;
  const rx = x * sa - y * ca;
  const ry = (x * ca + y * sa) * se - z * ce;
  return [r1(ox + rx * k), r1(oy + ry * k)];
}

function depthOf(pt, P) {
  const { ca, sa, ce, se } = cameraOf(P);
  const [x, y, z] = pt;
  return (x * ca + y * sa) * ce + z * se;
}

function towardViewer(P) {
  const { ca, sa } = cameraOf(P);
  return [ca, sa];
}

function screenRise(h, P) {
  const { ce } = cameraOf(P);
  return h * ce * (P.scale ?? 1);
}

function fitProjection(points, width, height, opts = {}) {
  const pad = opts.pad ?? 24;
  const headroom = opts.headroom ?? 0;
  const azimuth = opts.azimuth ?? 45;
  const elevation = opts.elevation ?? 30;
  const probe = { origin: [0, 0], scale: 1, azimuth, elevation };
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of points) {
    const [sx, sy] = iso(p, probe);
    if (sx < minX) minX = sx;
    if (sx > maxX) maxX = sx;
    if (sy < minY) minY = sy;
    if (sy > maxY) maxY = sy;
  }
  const spanX = Math.max(1e-6, maxX - minX);
  const spanY = Math.max(1e-6, maxY - minY);
  const availW = width - pad * 2;
  const availH = height - pad * 2 - headroom;
  const scale = Math.min(availW / spanX, availH / spanY);
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const ox = width / 2 - cx * scale;
  const oy = pad + headroom + availH / 2 - cy * scale;
  return { origin: [ox, oy], scale, azimuth, elevation };
}

function axisVector(P, dir) {
  const a = iso([0, 0, 0], P);
  const b = iso(dir, P);
  return [b[0] - a[0], b[1] - a[1]];
}

function translateAlong(P, offset) {
  const a = iso([0, 0, 0], P);
  const b = iso(offset, P);
  return `translate(${r1(b[0] - a[0])} ${r1(b[1] - a[1])})`;
}

function boxCorners(plan, z0, z1) {
  const { x, y, w, d } = plan;
  return [
    [x, y, z0], [x + w, y, z0], [x + w, y + d, z0], [x, y + d, z0],
    [x, y, z1], [x + w, y, z1], [x + w, y + d, z1], [x, y + d, z1],
  ];
}

function insetPlan(plan, by) {
  const w = Math.max(1, plan.w - by * 2);
  const d = Math.max(1, plan.d - by * 2);
  const r = Math.max(0, Math.min(plan.r - by, w / 2, d / 2));
  return { x: plan.x + by, y: plan.y + by, w, d, r };
}

function corners(plan, inset = 4) {
  const { x, y, w, d } = plan;
  return [
    [x + inset, y + inset],
    [x + w - inset, y + inset],
    [x + w - inset, y + d - inset],
    [x + inset, y + d - inset],
  ];
}

function ringOf(plan, steps = 8) {
  const { x, y, w, d } = plan;
  const r = Math.max(0, Math.min(plan.r || 0, w / 2, d / 2));
  if (r <= 0.05) {
    return [[x, y], [x + w, y], [x + w, y + d], [x, y + d]];
  }
  const pts = [];
  const arcs = [
    [x + w - r, y + r, -Math.PI / 2, 0],
    [x + w - r, y + d - r, 0, Math.PI / 2],
    [x + r, y + d - r, Math.PI / 2, Math.PI],
    [x + r, y + r, Math.PI, Math.PI * 1.5],
  ];
  for (const [cx, cy, a0, a1] of arcs) {
    for (let i = 0; i <= steps; i++) {
      const t = a0 + (a1 - a0) * (i / steps);
      pts.push([cx + Math.cos(t) * r, cy + Math.sin(t) * r]);
    }
  }
  return pts;
}

const roundedPlan = ringOf;

function circleRing(cx, cy, r, steps = 32) {
  const pts = [];
  for (let i = 0; i < steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    pts.push([cx + Math.cos(t) * r, cy + Math.sin(t) * r]);
  }
  return pts;
}

function polyPath(pts, closed = true) {
  if (!pts.length) return '';
  let d = `M${r1(pts[0][0])} ${r1(pts[0][1])}`;
  for (let i = 1; i < pts.length; i++) {
    d += `L${r1(pts[i][0])} ${r1(pts[i][1])}`;
  }
  return closed ? d + 'Z' : d;
}

// Convex hull (Andrew's monotone chain) in 2D screen space
function convexHull(pts) {
  const s = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (s.length <= 2) return s;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const p of s) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = s.length - 1; i >= 0; i--) {
    const p = s[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  upper.pop();
  lower.pop();
  return lower.concat(upper);
}

// Camera-locked directional light for 4-tone bucket shading
function sideShadeBucket(nx, ny, P) {
  const { ca, sa } = cameraOf(P);
  // Light comes from upper-left relative to viewer
  const lx = ca * 0.55 - sa * 0.83;
  const ly = sa * 0.55 + ca * 0.83;
  const dot = nx * lx + ny * ly;
  if (dot > 0.55) return 0;
  if (dot > 0.05) return 1;
  if (dot > -0.45) return 2;
  return 3;
}

/**
 * Extrude any 2D floor polygon ring from z to z + h into 4-tone SolidPaths.
 */
function extrude(ring, z, h, P, opts = {}) {
  const convex = opts.convex !== false;
  const bevel = opts.bevel ?? 0;
  const [vx, vy] = towardViewer(P);
  const n = ring.length;

  // Ensure clockwise orientation in (x,y) so outward edge normals are consistent
  let area2 = 0;
  for (let i = 0; i < n; i++) {
    const a = ring[i], b = ring[(i + 1) % n];
    area2 += (b[0] - a[0]) * (b[1] + a[1]);
  }
  const ordered = area2 >= 0 ? ring : ring.slice().reverse();

  const bot2 = ordered.map(([x, y]) => iso([x, y, z], P));
  const top2 = ordered.map(([x, y]) => iso([x, y, z + h], P));

  const shades = ['', '', '', ''];
  const creaseSegs = [];
  const visFlags = [];

  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const dx = ordered[j][0] - ordered[i][0];
    const dy = ordered[j][1] - ordered[i][1];
    const len = Math.hypot(dx, dy);
    if (len < 1e-6) {
      visFlags.push(false);
      continue;
    }
    // Outward normal for CW ring in (x,y)
    const nx = dy / len;
    const ny = -dx / len;
    const facing = nx * vx + ny * vy;
    const visible = facing > 0.001;
    visFlags.push(visible);
    if (visible && h > 0.05) {
      const quad = [top2[i], top2[j], bot2[j], bot2[i]];
      const bucket = sideShadeBucket(nx, ny, P);
      shades[bucket] += polyPath(quad, true);
      creaseSegs.push(`M${r1(top2[i][0])} ${r1(top2[i][1])}L${r1(top2[j][0])} ${r1(top2[j][1])}`);
    }
  }

  const top = polyPath(top2, true);
  let fill, outline;
  if (convex) {
    const hull = convexHull(bot2.concat(top2));
    fill = polyPath(hull, true);
    outline = fill;
  } else {
    fill = top + shades.join('');
    outline = top;
  }

  let bevelPath = '';
  if (bevel > 0 && h > 0.1) {
    // Inset visible top edges slightly toward centroid
    let cx = 0, cy = 0;
    for (const p of ordered) { cx += p[0]; cy += p[1]; }
    cx /= n; cy /= n;
    const insetTop = ordered.map(([x, y]) => {
      const dx = cx - x, dy = cy - y;
      const d = Math.hypot(dx, dy) || 1;
      return iso([x + (dx / d) * bevel, y + (dy / d) * bevel, z + h], P);
    });
    for (let i = 0; i < n; i++) {
      if (visFlags[i]) {
        const j = (i + 1) % n;
        bevelPath += `M${r1(insetTop[i][0])} ${r1(insetTop[i][1])}L${r1(insetTop[j][0])} ${r1(insetTop[j][1])}`;
      }
    }
  }

  return {
    fill,
    outline,
    crease: creaseSegs.join(''),
    top,
    shades,
    bevel: bevelPath || undefined,
  };
}

function slabOf(plan, z, h, P, steps = 6, bevel = 0) {
  return extrude(ringOf(plan, steps), z, h, P, { convex: true, bevel });
}

function cylinder(cx, cy, r, z, h, P, steps = 28, bevel = 0) {
  return extrude(circleRing(cx, cy, r, steps), z, h, P, { convex: true, bevel });
}

function haloOf(plan, z, h, P) {
  const expanded = insetPlan(plan, -4);
  const pts = ringOf(expanded, 6).map(([x, y]) => iso([x, y, z], P));
  return polyPath(convexHull(pts), true);
}

/**
 * Custom 3D faceted solid (for angled car panels, hood, roof, fastback glass, diffuser).
 * Takes list of 3D polygon faces with outward normals; returns SolidPaths compatible with solidSvg.
 */
function polyhedron(faces, P) {
  const { ca, sa, ce, se } = cameraOf(P);
  const viewDir = [ca * ce, sa * ce, se];
  const lx = ca * 0.55 - sa * 0.83;
  const ly = sa * 0.55 + ca * 0.83;
  const lz = 0.72;
  const llen = Math.hypot(lx, ly, lz);
  const light = [lx / llen, ly / llen, lz / llen];

  const all2 = [];
  const shades = ['', '', '', ''];
  let top = '';
  const creaseSegs = [];

  for (const f of faces) {
    const pts3 = f.pts;
    const pts2 = pts3.map((p) => iso(p, P));
    for (const p2 of pts2) all2.push(p2);

    // Compute face normal if not provided
    let n = f.normal;
    if (!n) {
      const a = pts3[0], b = pts3[1], c = pts3[2];
      const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
      const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
      const nx = uy * vz - uz * vy;
      const ny = uz * vx - ux * vz;
      const nz = ux * vy - uy * vx;
      const nl = Math.hypot(nx, ny, nz) || 1;
      n = [nx / nl, ny / nl, nz / nl];
    }

    const facing = n[0] * viewDir[0] + n[1] * viewDir[1] + n[2] * viewDir[2];
    if (facing <= 0.001) continue;

    const pStr = polyPath(pts2, true);
    if (f.isTop || n[2] > 0.72) {
      top += pStr;
    } else {
      const ldot = n[0] * light[0] + n[1] * light[1] + n[2] * light[2];
      const bucket = ldot > 0.52 ? 0 : ldot > 0.12 ? 1 : ldot > -0.25 ? 2 : 3;
      shades[bucket] += pStr;
    }

    if (f.crease !== false) {
      for (let i = 0; i < pts2.length; i++) {
        const j = (i + 1) % pts2.length;
        creaseSegs.push(`M${r1(pts2[i][0])} ${r1(pts2[i][1])}L${r1(pts2[j][0])} ${r1(pts2[j][1])}`);
      }
    }
  }

  const hull = convexHull(all2);
  const hullPath = polyPath(hull, true);
  return {
    fill: hullPath,
    outline: hullPath,
    crease: creaseSegs.join(''),
    top,
    shades,
  };
}

// --- Lines on faces ---
function onTop(points, z, P, closed = false) {
  return polyPath(points.map(([x, y]) => iso([x, y, z], P)), closed);
}

function lineOnTop(a, b, z, P) {
  const p1 = iso([a[0], a[1], z], P);
  const p2 = iso([b[0], b[1], z], P);
  return `M${r1(p1[0])} ${r1(p1[1])}L${r1(p2[0])} ${r1(p2[1])}`;
}

function planOutline(plan, z, P, steps = 6) {
  return onTop(ringOf(plan, steps), z, P, true);
}

function ring(cx, cy, r, z, P, steps = 28) {
  return onTop(circleRing(cx, cy, r, steps), z, P, true);
}

function segment(a, b, P) {
  const p1 = iso(a, P);
  const p2 = iso(b, P);
  return `M${r1(p1[0])} ${r1(p1[1])}L${r1(p2[0])} ${r1(p2[1])}`;
}

function rise(at, z0, z1, P) {
  return segment([at[0], at[1], z0], [at[0], at[1], z1], P);
}

function pointsAt(points, P) {
  return points.map((p) => iso(p, P));
}

function dotGrid(x, y, cols, rows, gap, z, P) {
  const out = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      out.push(iso([x + c * gap, y + r * gap, z], P));
    }
  }
  return out;
}

// --- Parts library ---
function knurl(cx, cy, r, z0, z1, count, P, inset = 0.4) {
  const [vx, vy] = towardViewer(P);
  let d = '';
  for (let i = 0; i < count; i++) {
    const t = (i / count) * Math.PI * 2;
    const nx = Math.cos(t), ny = Math.sin(t);
    if (nx * vx + ny * vy > 0.12) {
      d += rise([cx + nx * r, cy + ny * r], z0 + inset, z1 - inset, P);
    }
  }
  return d;
}

function sideArc(cx, cy, r, z, P, steps = 32) {
  const [vx, vy] = towardViewer(P);
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    const nx = Math.cos(t), ny = Math.sin(t);
    if (nx * vx + ny * vy >= -0.02) {
      pts.push(iso([cx + nx * r, cy + ny * r, z], P));
    }
  }
  return pts.length > 1 ? polyPath(pts, false) : '';
}

function sideSeam(plan, z, P, steps = 6) {
  const ringPts = ringOf(plan, steps);
  const [vx, vy] = towardViewer(P);
  const n = ringPts.length;
  let d = '';
  let inSeg = false;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const dx = ringPts[j][0] - ringPts[i][0];
    const dy = ringPts[j][1] - ringPts[i][1];
    const len = Math.hypot(dx, dy) || 1;
    const nx = dy / len, ny = -dx / len;
    if (nx * vx + ny * vy > 0.001) {
      const p1 = iso([ringPts[i][0], ringPts[i][1], z], P);
      const p2 = iso([ringPts[j][0], ringPts[j][1], z], P);
      d += inSeg ? `L${r1(p2[0])} ${r1(p2[1])}` : `M${r1(p1[0])} ${r1(p1[1])}L${r1(p2[0])} ${r1(p2[1])}`;
      inSeg = true;
    } else {
      inSeg = false;
    }
  }
  return d;
}

function topTicks(from, to, step, every, edge, z, [minorLen, majorLen], P, axis = 'x') {
  let minor = '', major = '';
  let idx = 0;
  for (let pos = from; pos <= to + 1e-6; pos += step, idx++) {
    const isMajor = idx % every === 0;
    const len = isMajor ? majorLen : minorLen;
    const seg = axis === 'x'
      ? lineOnTop([pos, edge], [pos, edge + len], z, P)
      : lineOnTop([edge, pos], [edge + len, pos], z, P);
    if (isMajor) major += seg; else minor += seg;
  }
  return { minor, major };
}

function sideTicks(from, to, step, every, face, topZ, [minorLen, majorLen], P, axis = 'x') {
  let minor = '', major = '';
  let idx = 0;
  for (let pos = from; pos <= to + 1e-6; pos += step, idx++) {
    const isMajor = idx % every === 0;
    const len = isMajor ? majorLen : minorLen;
    const seg = axis === 'x'
      ? rise([pos, face], topZ - len, topZ, P)
      : rise([face, pos], topZ - len, topZ, P);
    if (isMajor) major += seg; else minor += seg;
  }
  return { minor, major };
}

function radialTicks(cx, cy, r, count, every, z, [minorLen, majorLen], P, from = 0, span = Math.PI * 2) {
  let minor = '', major = '';
  const closed = Math.abs(span - Math.PI * 2) < 1e-4;
  const total = closed ? count : count + 1;
  for (let i = 0; i < total; i++) {
    const t = from + (i / count) * span;
    // Angle 0 points to -y, increasing clockwise
    const ux = Math.sin(t);
    const uy = -Math.cos(t);
    const isMajor = i % every === 0;
    const len = isMajor ? majorLen : minorLen;
    const seg = lineOnTop(
      [cx + ux * r, cy + uy * r],
      [cx + ux * (r - len), cy + uy * (r - len)],
      z,
      P
    );
    if (isMajor) major += seg; else minor += seg;
  }
  return { minor, major };
}

// --- SVG string builders ---
function solidSvg(paths, opts = {}) {
  const tone = opts.tone ?? 'hi';
  const crease = opts.crease ?? 'faint';
  const lit = opts.lit ? ' data-lit="1"' : '';
  const flat = opts.flat ? ' data-flat="1"' : '';
  const cls = opts.className ? `iso-solid ${opts.className}` : 'iso-solid';
  const partAttr = opts.part ? ` data-part="${opts.part}"` : '';
  let out = `<g class="${cls}" data-tone="${tone}"${lit}${flat}${partAttr}>`;
  if (opts.halo) out += `<path class="iso-halo" d="${opts.halo}"/>`;
  if (paths.fill) out += `<path class="iso-fill" d="${paths.fill}"/>`;
  if (!opts.flat && paths.shades) {
    for (let i = 0; i < 4; i++) {
      if (paths.shades[i]) out += `<path class="iso-shade-${i}" d="${paths.shades[i]}"/>`;
    }
  }
  if (paths.top) out += `<path class="iso-top" d="${paths.top}"/>`;
  if (paths.crease && !opts.noCrease) {
    out += `<path class="iso-crease" data-tone="${crease}" d="${paths.crease}"/>`;
  }
  if (paths.bevel) out += `<path class="iso-bevel" d="${paths.bevel}"/>`;
  if (opts.inner) out += opts.inner;
  if (paths.outline) out += `<path class="iso-edge" data-tone="${tone}" d="${paths.outline}"/>`;
  out += '</g>';
  return out;
}

function lineSvg(d, opts = {}) {
  if (!d) return '';
  const tone = opts.tone ?? 'lo';

    title: 'Clean attached flow',

function clamp(v, lo, hi) {

/**
 * Evaluate the aerodynamic state from user controls.
 * @param {{ bodyType?: string, windSpeedKmh?: number, rearAngleDeg?: number, diffuserAngleDeg?: number, streamlines?: boolean }} input
 */
function evaluateAero(input = {}) {
  const bodyType = BODY_PRESETS[input.bodyType] ? input.bodyType : 'fastback';
  const preset = BODY_PRESETS[bodyType];

  const windSpeedKmh = clamp(Number(input.windSpeedKmh ?? 110), 60, 140);
  const rearAngleDeg = clamp(Number(input.rearAngleDeg ?? 24), 18, 32);
  const diffuserAngleDeg = clamp(Number(input.diffuserAngleDeg ?? 9.5), 0, 15);
  const streamlines = input.streamlines !== false;

  // Rear window angle effect on Cd, Cl, and separation point
  const dAngle = rearAngleDeg - 24;
  let cdRearDelta = 0;
  let clRearDelta = 0;
  if (dAngle >= 0) {
    // Steepening rear window beyond 24 deg pushes separation forward and grows wake drag
    cdRearDelta = preset.angleSensitivity * (0.0046 * dAngle + 0.00052 * dAngle * dAngle);
    clRearDelta = preset.angleSensitivity * (0.0058 * dAngle);
  } else {
    // Shallower backlight slightly reduces pressure drag
    cdRearDelta = preset.angleSensitivity * (0.0018 * dAngle);
    clRearDelta = preset.angleSensitivity * (0.0022 * dAngle);
  }

  // Diffuser angle effect on Cl (downforce) and Cd (small optimum near 9.5 deg)
  const dDiff = diffuserAngleDeg - 9.5;
  const clDiffDelta = -0.0085 * dDiff;
  const cdDiffDelta = 0.00026 * dDiff * dDiff;

  const cd = +(preset.cd0 + cdRearDelta + cdDiffDelta).toFixed(3);
  const cl = +(preset.cl0 + clRearDelta + clDiffDelta).toFixed(3);
  const pi90 = preset.pi90;
  const cdLow = +(cd - pi90).toFixed(4);
  const cdHigh = +(cd + pi90).toFixed(4);

  const areaM2 = preset.areaM2;
  const cdA = +(cd * areaM2).toFixed(3);

  const vMs = windSpeedKmh / 3.6;
  const aeroPowerKw = +((0.5 * AIR_DENSITY * cdA * vMs * vMs * vMs) / 1000).toFixed(2);

  // EV range delta vs 0.285 Cd reference on 75 kWh battery
  // Calibrated so baseline fastback (Cd 0.264) gives exactly +14.2 km
  const evRangeDeltaKm = +(((REF_CD - cd) / (REF_CD - 0.264)) * BASELINE_RANGE_GAIN_KM).toFixed(1);

  // Separation point along rear window (0 = roof header / early sep, 1 = rear deck / fully attached)
  let separationFrac;
  if (bodyType === 'estateback') {
    separationFrac = clamp(0.14 - 0.004 * dAngle, 0.08, 0.20);
  } else if (bodyType === 'notchback') {
    separationFrac = clamp(0.70 - 0.055 * Math.max(0, dAngle) + 0.015 * Math.min(0, dAngle), 0.20, 0.82);
  } else {
    // Fastback: clean at 24 deg (0.86), drops sharply as angle rises toward 32 deg (0.24)
    separationFrac = clamp(0.86 - 0.082 * Math.max(0, dAngle) + 0.012 * Math.min(0, dAngle), 0.22, 0.94);
  }

  // Normalized wake intensity (0.25 compact .. 1.0 massive)
  const wakeSize = clamp(
    preset.wakeBase + preset.angleSensitivity * (0.062 * Math.max(0, dAngle) + 0.008 * Math.min(0, dAngle)) - 0.006 * dDiff,
    0.22,
    1.0
  );

  // Roof peak velocity ratio (faster over clean roof, slightly higher suction with diffuser)
  const roofVelRatio = +(1.28 + 0.006 * (diffuserAngleDeg - 9.5) - 0.08 * (wakeSize - 0.28)).toFixed(3);
  const underbodyUpwash = clamp(diffuserAngleDeg / 15, 0, 1);

  // Determine active case label
  let caseLabel = 'Custom setup';
  if (
    bodyType === 'fastback' &&
    Math.abs(rearAngleDeg - 24) < 0.2 &&
    Math.abs(diffuserAngleDeg - 9.5) < 0.2
  ) {
    caseLabel = 'Case 1 · Clean fastback';
  } else if (
    bodyType === 'fastback' &&
    rearAngleDeg >= 29.5 &&
    Math.abs(diffuserAngleDeg - 9.5) < 0.5
  ) {
    caseLabel = 'Case 2 · Steep backlight';
  } else if (bodyType === 'estateback') {
    caseLabel = 'Case 3 · Estateback';
  }

  return {
    bodyType,
    bodyLabel: preset.label,
    windSpeedKmh,
    vMs: +vMs.toFixed(2),
    rearAngleDeg,
    diffuserAngleDeg,
    streamlines,
    cd,
    cl,
    pi90,
    cdLow,
    cdHigh,
    displayAreaM2: preset.displayAreaM2,
    cdA,
    aeroPowerKw,
    evRangeDeltaKm,
    separationFrac: +separationFrac.toFixed(3),
    wakeSize: +wakeSize.toFixed(3),
    roofVelRatio,
    underbodyUpwash: +underbodyUpwash.toFixed(3),
    flowSpeedScale: +(windSpeedKmh / 110).toFixed(3),
    caseLabel,
  };
}

function getCarProfile(aero) {

function evalPorscheCenterZ(x, aero, xRoofEnd, zTailTop, xDeckStart = 208, zDeck = 48.6) {

      zCrown = Math.max(zBelt + 0.6, zCenter + fenderBump * 0.85);
      wRail = wBelt * 0.42;
      zRail = zCenter + 0.25;
    } else if (cabinH > 1.4) {
      // Greenhouse with authentic Porsche tumblehome (narrow teardrop cabin over wide hips!)
      const taperFront = smoothstep(144, 163, x);
      const taperRear = aero.bodyType === 'estateback'
        ? lerp(1.0, 0.86, smoothstep(200, 232, x))
        : lerp(1.0, 0.70, smoothstep(175, 232, x));
      const roofHalfW = 14.2 * taperRear;
      const baseCabinW = wBelt - 2.4 - (x > 184 ? 2.0 * gauss(x, xRearAxle, 14) : 0);
      wCrown = baseCabinW;
      zCrown = zBelt + 1.2;
      wRail = lerp(baseCabinW - 1.2, roofHalfW, Math.min(1, cabinH / 14.5) * (0.42 + 0.58 * taperFront));
      zRail = zCenter - 1.45;
    } else {
      // Rear deck / ducktail
      wCrown = wBelt * 0.82;
      zCrown = zBelt + 0.8;
      wRail = wBelt * 0.48;
      zRail = zCenter - 0.35;
    }

    const wSill = wBelt - 2.2;
    const wUndercut = wBelt - 0.9;
    const wFlank = wBelt + 0.65;
    const zUndercut = Math.max(zSillOuter + 0.5, lerp(zSill, zBelt, 0.24));
    const zFlank = Math.max(zUndercut + 0.8, lerp(zSill, zBelt, 0.58));

    return [
      [x, cy - wSill, zSillOuter],      // 0: far sill
      [x, cy - wUndercut, zUndercut],   // 1: far undercut
      [x, cy - wFlank, zFlank],         // 2: far flank
      [x, cy - wBelt, zBelt],           // 3: far beltline
      [x, cy - wCrown, zCrown],         // 4: far fender crown / cabin base
      [x, cy - wRail, zRail],           // 5: far roof rail / hood crease
      [x, cy, zCenter],                 // 6: centerline crown
      [x, cy + wRail, zRail],           // 7: near roof rail / hood crease
      [x, cy + wCrown, zCrown],         // 8: near fender crown / cabin base
      [x, cy + wBelt, zBelt],           // 9: near beltline
      [x, cy + wFlank, zFlank],         // 10: near flank
      [x, cy + wUndercut, zUndercut],   // 11: near undercut
      [x, cy + wSill, zSillOuter],      // 12: near sill
    ];
  }

  const ribs = stations.map(evalPorscheRib);
  const meshFaces = [];
  const edgeMap = new Map();

  function addQuad(p0, p1, p2, p3, mat, part = 'car', forceVisible = false) {
    const ux = p1[0] - p0[0], uy = p1[1] - p0[1], uz = p1[2] - p0[2];
    const vx = p3[0] - p0[0], vy = p3[1] - p0[1], vz = p3[2] - p0[2];
    let nx = uy * vz - uz * vy;
    let ny = uz * vx - ux * vz;
    let nz = ux * vy - uy * vx;
    const nl = Math.hypot(nx, ny, nz);
    if (nl < 1e-6) return;
    nx /= nl; ny /= nl; nz /= nl;

    const facing = nx * viewDir[0] + ny * viewDir[1] + nz * viewDir[2];
    const isFront = forceVisible || facing > -0.015;

    const pts3 = [p0, p1, p2, p3];
    const keyPt = (p) => `${Math.round(p[0] * 10)},${Math.round(p[1] * 10)},${Math.round(p[2] * 10)}`;
    for (let e = 0; e < 4; e++) {
      const a = pts3[e], b = pts3[(e + 1) % 4];
      const ka = keyPt(a), kb = keyPt(b);
      const ek = ka < kb ? `${ka}|${kb}` : `${kb}|${ka}`;
      let rec = edgeMap.get(ek);
      if (!rec) { rec = { a, b, front: 0, back: 0 }; edgeMap.set(ek, rec); }
      if (isFront) rec.front++; else rec.back++;
    }

    if (!isFront) return;

    const cx = (p0[0] + p1[0] + p2[0] + p3[0]) / 4;
    const ccy = (p0[1] + p1[1] + p2[1] + p3[1]) / 4;
    const cz = (p0[2] + p1[2] + p2[2] + p3[2]) / 4;

    let q = '1';
    if (nz > 0.72) {
      q = 'top';
    } else {
      const ld = nx * lightDir[0] + ny * lightDir[1] + nz * lightDir[2];
      q = ld > 0.50 ? '0' : ld > 0.12 ? '1' : ld > -0.26 ? '2' : '3';
    }

    const pts2 = pts3.map((p) => K.iso(p, P));
    const d = `M${pts2[0][0]} ${pts2[0][1]}L${pts2[1][0]} ${pts2[1][1]}L${pts2[2][0]} ${pts2[2][1]}L${pts2[3][0]} ${pts2[3][1]}Z`;
    meshFaces.push({ key: K.depthOf([cx, ccy, cz], P), d, mat, q, part });
  }

  // Loft 12 strips per station across all 33 segments
  for (let i = 0; i < ribs.length - 1; i++) {
    const r0 = ribs[i];
    const r1 = ribs[i + 1];
    const xMid = (stations[i] + stations[i + 1]) / 2;

    for (let j = 0; j < 12; j++) {
      let mat = 'body';
      let part = 'car';

      // Lower aero rocker skirt & front/rear trim
      if (j === 0 || j === 11) {
        mat = 'trim';
      }
      // Side air-curtain vent behind front wheel arch (x = 139..145, flank j=1,10)
      if (xMid > 139 && xMid < 145.5 && (j === 1 || j === 10)) {
        mat = 'glass';
      }
      // Porsche curved windshield glass (x = 144.5..162.5, top strips j=5,6)
      if (xMid > 144.5 && xMid < 162.5 && (j === 5 || j === 6)) {
        mat = 'glass';
      }
      // Iconic Porsche teardrop side DLO glass (j=4 far side, j=7 near side)
      const dloEndX = aero.bodyType === 'estateback' ? 216 : aero.bodyType === 'notchback' ? 194 : 204;
      if (xMid > 149 && xMid < dloEndX && (j === 4 || j === 7)) {
        mat = 'glass';
      }
      // Rear fastback / backlight glass
      const rearGlassEndX = aero.bodyType === 'notchback' ? carProf.xDeckStart : 225;
      if (xMid >= carProf.roofEndX && xMid < rearGlassEndX && (j === 5 || j === 6)) {
        mat = 'glass';
        part = 'rear-window';
      }
      // Porsche sculpted recessed headlights on front fender slopes (x = 107.5..114, j=3,8)
      if (xMid > 107.5 && xMid < 114.2 && (j === 3 || j === 8)) {
        mat = 'glass';
      }

      addQuad(r0[j], r1[j], r1[j + 1], r0[j + 1], mat, part);
    }
  }

  // Close front nose cap (rib 0) with twin Porsche air intakes
  const rn = ribs[0];
  for (let j = 0; j < 6; j++) {
    addQuad(rn[j], rn[j + 1], rn[11 - j], rn[12 - j], j <= 1 ? 'trim' : 'body', 'car');
  }

  // Close rear Porsche tail cap (last rib) with recessed dark diffuser, bumper, and slim full-width Porsche LED lightbar
  const rt = ribs[ribs.length - 1];
  const lbLoL = [rt[2][0], lerp(rt[2][1], rt[3][1], 0.55), lerp(rt[2][2], rt[3][2], 0.55)];
  const lbLoR = [rt[10][0], lerp(rt[10][1], rt[9][1], 0.55), lerp(rt[10][2], rt[9][2], 0.55)];
  const lbHiL = [rt[2][0], lerp(rt[2][1], rt[3][1], 0.85), lerp(rt[2][2], rt[3][2], 0.85)];
  const lbHiR = [rt[10][0], lerp(rt[10][1], rt[9][1], 0.85), lerp(rt[10][2], rt[9][2], 0.85)];
  addQuad(rt[0], rt[12], rt[11], rt[1], 'trim', 'diffuser');
  addQuad(rt[1], rt[11], rt[10], rt[2], 'trim', 'diffuser');
  addQuad(rt[2], rt[10], lbLoR, lbLoL, 'body', 'car');
  addQuad(lbLoL, lbLoR, lbHiR, lbHiL, 'accent', 'car');       // Iconic Porsche full-width LED lightbar
  addQuad(lbHiL, lbHiR, rt[9], rt[3], 'body', 'car');
  addQuad(rt[3], rt[9], rt[8], rt[4], 'body', 'car');
  addQuad(rt[4], rt[8], rt[7], rt[5], 'body', 'car');

  // Active rear lip spoiler on tail deck
  const spZ = Math.min(carProf.tailTopZ, 50.5);
  addQuad(
    [226.5, cy - 15.5, spZ + 0.6],
    [232.8, cy - 14.5, spZ + 1.8],
    [232.8, cy + 14.5, spZ + 1.8],
    [226.5, cy + 15.5, spZ + 0.6],
    'body',
    'car',
    true
  );

  // Rear underbody diffuser tray & 4 vertical aero strakes (tilts live with diffuserAngleDeg!)
  const diffZ0 = 28.4;
  const diffZ1 = 28.4 + diffLift;
  addQuad([210, cy - 16.5, diffZ0], [231.5, cy - 16.5, diffZ1], [231.5, cy + 16.5, diffZ1], [210, cy + 16.5, diffZ0], 'trim', 'diffuser', true);
  for (const sy of [cy - 11.2, cy - 3.8, cy + 3.8, cy + 11.2]) {
    addQuad(
      [212, sy, diffZ0],
      [231.5, sy, diffZ1],
      [231.5, sy, diffZ1 - 2.6],
      [212, sy, diffZ0 - 1.4],
      'trim',
      'diffuser',
      true
    );
  }

  // Front aerodynamic splitter lip
  addQuad(
    [101.5, cy - 15.5, 28.8],
    [112, cy - 22.0, 28.8],
    [112, cy + 22.0, 28.8],
    [101.5, cy + 15.5, 28.8],
    'trim',
    'car',
    true
  );

  // Sculpted Porsche sport side mirrors on door shoulders
  for (const side of [-1, 1]) {
    const my0 = cy + side * 21.8;
    const my1 = cy + side * 27.0;
    const mz0 = 46.8, mz1 = 49.8;
    addQuad([149, my0, mz1], [155.5, my0, mz1], [155.5, my1, mz1 - 0.6], [149, my1, mz1 - 0.6], 'body', 'car', true);
    addQuad([149, my1, mz0], [155.5, my1, mz0], [155.5, my1, mz1 - 0.6], [149, my1, mz1 - 0.6], 'body', 'car', true);
  }

  meshFaces.sort((a, b) => a.key - b.key);

  // Exact silhouette edges (shared by 1 front-facing and 1 back-facing quad)
  let silPath = '';
  for (const rec of edgeMap.values()) {
    if (rec.front > 0 && rec.back > 0) {
      const p1 = K.iso(rec.a, P);
      const p2 = K.iso(rec.b, P);
      silPath += `M${p1[0]} ${p1[1]}L${p2[0]} ${p2[1]}`;
    }
  }

  // Crisp Porsche character lines: hood valley creases, dynamic beltline, curved teardrop DLO frame, B-pillar
  const nearBeltD = ribs.map((r, i) => `${i === 0 ? 'M' : 'L'}${K.iso(r[9], P)[0]} ${K.iso(r[9], P)[1]}`).join('');
  const nearRoofD = ribs.map((r, i) => `${i === 0 ? 'M' : 'L'}${K.iso(r[7], P)[0]} ${K.iso(r[7], P)[1]}`).join('');
  const farRoofD = ribs.map((r, i) => `${i === 0 ? 'M' : 'L'}${K.iso(r[5], P)[0]} ${K.iso(r[5], P)[1]}`).join('');
  const bIdx = ribs.findIndex((_, idx) => stations[idx] >= 171);
  const bPillarD = bIdx > 0 ? K.segment(ribs[bIdx][8], ribs[bIdx][7], P) : '';

  // Porsche 4-point quad-LED DRL dots inside the near-side headlight housing
  const nearHeadlightRib = evalPorscheRib(110.5);
  const hlCenter = [
    lerp(nearHeadlightRib[8][0], nearHeadlightRib[9][0], 0.45),
    lerp(nearHeadlightRib[8][1], nearHeadlightRib[9][1], 0.45),
    lerp(nearHeadlightRib[8][2], nearHeadlightRib[9][2], 0.45) + 0.3,
  ];
  const quadLedDots = K.dotsSvg(
    K.pointsAt([
      [hlCenter[0] - 1.3, hlCenter[1] - 0.8, hlCenter[2] - 0.5],
      [hlCenter[0] + 1.3, hlCenter[1] - 0.8, hlCenter[2] + 0.5],
      [hlCenter[0] - 1.3, hlCenter[1] + 0.8, hlCenter[2] - 0.5],
      [hlCenter[0] + 1.3, hlCenter[1] + 0.8, hlCenter[2] + 0.5],
    ], P),
    { size: 0.9, tone: 'lit' }
  );

  // Live boundary-layer separation ridge conforming directly to the 3D curved rear window
  const rs = carProf.rearStart;
  const re = carProf.rearEnd;
  const sepT = aero.separationFrac;
  const sepX = lerp(rs[0], re[0], sepT);
  const sepZ = carProf.zAt(sepX);
  const sepRib = evalPorscheRib(sepX);
  const sepCurvePts = [sepRib[5], sepRib[6], sepRib[7]].map((p) => K.iso(p, P));
  const sepCurveD = `M${sepCurvePts[0][0]} ${sepCurvePts[0][1]}L${sepCurvePts[1][0]} ${sepCurvePts[1][1]}L${sepCurvePts[2][0]} ${sepCurvePts[2][1]}`;
  const sepDots = K.dotsSvg([sepCurvePts[0], sepCurvePts[2]], { size: 1.5, tone: 'lit' });

  const bodySvg =
    meshFaces.map((f) => `<path class="iso-mesh-face" data-mat="${f.mat}" data-q="${f.q}" d="${f.d}"/>`).join('') +
    `<path class="iso-car-crease" d="${nearBeltD}${nearRoofD}${farRoofD}${bPillarD}"/>` +
    `<path class="iso-car-feature" d="${silPath}"/>` +
    quadLedDots +
    K.lineSvg(sepCurveD, { tone: 'lit', dashed: true }) +
    sepDots;

  addRaw([168, cy, 44], bodySvg, 6, 'car');

  // --- 4 Detailed 3D Porsche 5-Twin-Spoke Alloy Wheels with Brake Rotors & Calipers ---
  function makePorscheWheel(wx, wy, isNear) {
    const rOuter = 9.4;
    const rRim = 6.2;
    const rDisc = 4.6;
    const rHub = 1.9;
    const halfT = 3.4;
    const cz = zAxle;
    const steps = 22;
    const yIn = wy - (isNear ? halfT : -halfT);
    const yOut = wy + (isNear ? halfT : -halfT);

    const ringIn = [], ringOut = [];
    for (let i = 0; i < steps; i++) {
      const a = (i / steps) * Math.PI * 2;
      ringIn.push([wx + Math.cos(a) * rOuter, yIn, cz + Math.sin(a) * rOuter]);
      ringOut.push([wx + Math.cos(a) * rOuter, yOut, cz + Math.sin(a) * rOuter]);
    }
    const faces = [
      { pts: isNear ? ringOut : ringOut.slice().reverse(), normal: [0, isNear ? 1 : -1, 0], crease: false },
      { pts: isNear ? ringIn.slice().reverse() : ringIn, normal: [0, isNear ? -1 : 1, 0], crease: false },
    ];
    for (let i = 0; i < steps; i++) {
      const j = (i + 1) % steps;
      const am = ((i + 0.5) / steps) * Math.PI * 2;
      faces.push({
        pts: isNear ? [ringIn[i], ringIn[j], ringOut[j], ringOut[i]] : [ringOut[i], ringOut[j], ringIn[j], ringIn[i]],
        normal: [Math.cos(am), 0, Math.sin(am)],
        crease: false,
      });
    }
    const tirePaths = K.polyhedron(faces, P);

    let wheelDetail = '';
    if (isNear) {
      const mkCircleD = (r, n = 20) => {
        const pts = [];
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2;
          pts.push(K.iso([wx + Math.cos(a) * r, yOut, cz + Math.sin(a) * r], P));
        }
        return pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0]} ${p[1]}`).join('') + 'Z';
      };
      const rimD = mkCircleD(rRim, 22);
      const discD = mkCircleD(rDisc, 18);
      const hubD = mkCircleD(rHub, 14);

      // Brake caliper arc on rear side of rotor (Porsche signature accented caliper)
      const calPts = [];
      for (let i = 0; i <= 5; i++) {
        const a = -0.55 + (1.1 * i) / 5;
        calPts.push(K.iso([wx + Math.cos(a) * (rDisc + 0.7), yOut, cz + Math.sin(a) * (rDisc + 0.7)], P));
      }
      for (let i = 5; i >= 0; i--) {
        const a = -0.55 + (1.1 * i) / 5;
        calPts.push(K.iso([wx + Math.cos(a) * (rDisc - 1.3), yOut, cz + Math.sin(a) * (rDisc - 1.3)], P));
      }
      const calD = calPts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0]} ${p[1]}`).join('') + 'Z';

      // 5 twin-spoke V-pairs (10 spokes cleanly anchored hub-to-rim -> 0 floating ends!)
      let spokesD = '';
      for (let s = 0; s < 5; s++) {
        const baseA = (s / 5) * Math.PI * 2 + 0.18;
        for (const off of [-0.14, 0.14]) {
          spokesD += K.segment(
            [wx + Math.cos(baseA + off * 0.7) * rHub, yOut, cz + Math.sin(baseA + off * 0.7) * rHub],
            [wx + Math.cos(baseA + off) * rRim, yOut, cz + Math.sin(baseA + off) * rRim],
            P
          );
        }
      }

      wheelDetail =
        `<path class="iso-mesh-face" data-mat="glass" data-q="3" d="${rimD}"/>` +
        `<path class="iso-mesh-face" data-mat="trim" data-q="1" d="${discD}"/>` +
        `<path class="iso-mesh-face" data-mat="accent" d="${calD}"/>` +
        K.lineSvg(rimD, { tone: 'lit' }) +
        K.lineSvg(spokesD, { tone: 'hi' }) +
        `<path class="iso-mesh-face" data-mat="body" data-q="top" d="${hubD}"/>` +
        K.lineSvg(hubD, { tone: 'lit' });
    }

    return K.solidSvg(tirePaths, { tone: 'hi', inner: wheelDetail, part: 'car' });
  }

  addRaw([xFrontAxle, 55.5, zAxle], makePorscheWheel(xFrontAxle, 55.5, false), -8, 'car');
  addRaw([xRearAxle, 55.5, zAxle], makePorscheWheel(xRearAxle, 55.5, false), -8, 'car');
  addRaw([xFrontAxle, 100.5, zAxle], makePorscheWheel(xFrontAxle, 100.5, true), 18, 'car');
  addRaw([xRearAxle, 100.5, zAxle], makePorscheWheel(xRearAxle, 100.5, true), 18, 'car');

  return { carProf, sepX, sepZ };
}

/**
 * Build the complete wind-tunnel scene SVG markup.
 * Returns { svg, partCount, aero, P }.
 */
function buildScene(state = {}, opts = {}) {
  const aero = evaluateAero(state);
  const azimuth = opts.azimuth ?? 56;
  const elevation = opts.elevation ?? 28;
  const fanAngle = opts.fanAngle ?? 0;
  const flowPhase = opts.flowPhase ?? 0;
  const hoveredPart = opts.hoveredPart ?? null;

  const P = makeProjection(azimuth, elevation);
  const items = [];
  let partCount = 0;

  const addSolid = (at, paths, style = {}, partGroup = null) => {
    partCount++;
    const key = K.depthOf(at, P) + (style.bias ?? 0);
    const svg = K.solidSvg(paths, style);
    items.push({ key, svg, partGroup });
  };

  const addRaw = (at, svg, bias = 0, partGroup = null) => {
    const key = K.depthOf(at, P) + bias;
    items.push({ key, svg, partGroup });
  };

  // =========================================================================
  // 1. BASE & BENCH ASSEMBLY (tone: lo)
  // =========================================================================
  const footPts = K.corners(BENCH_PLAN, 16);
  for (const [fx, fy] of footPts) {
    addSolid([fx, fy, 2], K.cylinder(fx, fy, 7.5, 0, 4, P, 18), { tone: 'lo', part: 'bench' }, 'bench');
    addSolid([fx, fy, 5], K.cylinder(fx, fy, 5.2, 4, 2.2, P, 16), { tone: 'lo', part: 'bench' }, 'bench');
  }

  const benchGroove = K.planOutline(K.insetPlan(BENCH_PLAN, 4), 18, P, 5);
  const benchSeam = K.sideSeam(BENCH_PLAN, 12, P, 5);
  const cornerBolts = K.corners(BENCH_PLAN, 9);
  const boltRings = cornerBolts.map(([bx, by]) => K.ring(bx, by, 2.2, 18, P, 14)).join('');
  const boltDots = K.dotsSvg(K.pointsAt(cornerBolts.map(([bx, by]) => [bx, by, 18]), P), { size: 0.75, tone: 'lo' });
  addSolid(
    [174, 92, 10],
    K.slabOf(BENCH_PLAN, 6, 12, P, 5, 1.0),
    {
      tone: 'lo',
      halo: K.haloOf(BENCH_PLAN, 0, 12, P),
      inner:
        K.lineSvg(benchGroove, { tone: 'faint' }) +
        K.lineSvg(benchSeam, { tone: 'faint' }) +
        K.lineSvg(boltRings, { tone: 'faint' }) +
        boltDots,
      bias: -240,
      part: 'bench',
    },
    'bench'
  );

  // Engraved serial plate on front-right bench apron
  const platePlan = { x: 282, y: 152, w: 54, d: 22, r: 1.2 };
  const plateRules =
    K.lineSvg(K.lineOnTop([288, 158], [326, 158], 20, P), { tone: 'mid', free: true }) +
    K.lineSvg(K.lineOnTop([288, 163], [318, 163], 20, P), { tone: 'lo', free: true }) +
    K.lineSvg(K.lineOnTop([288, 168], [322, 168], 20, P), { tone: 'lo', free: true });
  const plateRivets = K.dotsSvg(
    K.pointsAt([[285.5, 155.5, 20], [332.5, 155.5, 20], [285.5, 170.5, 20], [332.5, 170.5, 20]], P),
    { size: 0.55, tone: 'mid' }
  );
  addSolid(
    [309, 163, 19],
    K.slabOf(platePlan, 18, 2, P, 3),
    { tone: 'lo', inner: plateRules + plateRivets, part: 'bench' },
    'bench'
  );

  // Turntable balance assembly
  const ttCx = 168, ttCy = 78;
  addSolid(
    [ttCx, ttCy, 19],
    K.cylinder(ttCx, ttCy, 56, 18, 2.2, P, 40),
    {
      tone: 'mid',
      inner: K.lineSvg(K.ring(ttCx, ttCy, 53.5, 20.2, P, 40), { tone: 'faint' }),
      bias: -110,
      part: 'turntable',
    },
    'turntable'
  );

  const ttTicks = K.radialTicks(ttCx, ttCy, 50.5, 36, 3, 22.8, [2.2, 4.4], P);
  addSolid(
    [ttCx, ttCy, 21.5],
    K.cylinder(ttCx, ttCy, 51, 20.2, 2.6, P, 40),
    {
      tone: 'mid',
      inner:
        K.lineSvg(K.ring(ttCx, ttCy, 50.5, 22.8, P, 40), { tone: 'faint' }) +
        K.lineSvg(K.ring(ttCx, ttCy, 46.1, 22.8, P, 40), { tone: 'faint' }) +
        K.lineSvg(ttTicks.minor, { tone: 'lo', free: 'end' }) +
        K.lineSvg(ttTicks.major, { tone: 'mid', free: 'end' }),
      bias: -105,
      part: 'turntable',

  const swX = 248, swY = 156;
  const swIdx = aero.bodyType === 'fastback' ? 0 : aero.bodyType === 'notchback' ? 1 : 2;
  const swDetentYs = [149, 156, 163];
  addSolid([swX, swY, 28.5], box3(swX - 8, swY - 12, swX + 8, swY + 12, 27, 30, P, 1.0, 2), { tone: 'mid', bias: 120, part: 'car' }, 'car');
  for (let d = 0; d < 3; d++) {
    addSolid([swX - 4, swDetentYs[d], 30.5], K.cylinder(swX - 4, swDetentYs[d], 1.2, 30, 1.2, P, 10), { tone: d === swIdx ? 'hi' : 'lo', lit: d === swIdx, bias: 124, part: 'car' }, 'car');
  }
  const activeY = swDetentYs[swIdx];
  addSolid([swX + 2, activeY, 33], box3(swX - 1.5, activeY - 2.4, swX + 5.5, activeY + 2.4, 30, 36.5, P, 0.6, 2), { tone: 'hi', lit: true, bias: 128, part: 'car' }, 'car');

  // =========================================================================
  // PAINT BACK TO FRONT
  // =========================================================================
  items.sort((a, b) => a.key - b.key);

  const bodyMarkup = items
    .map((it) => {
      if (!it.partGroup) return it.svg;
      const cls = hoveredPart === it.partGroup ? 'iso-part-group is-hovered' : 'iso-part-group';
      return `<g class="${cls}" data-group="${it.partGroup}">${it.svg}</g>`;
    })
    .join('');

  const svg = K.figureSvg({
    width: VIEW_W,
    height: VIEW_H,
    label: `Isometric wind-tunnel test rig showing airflow over a 1:18 scale 3D Porsche ${aero.bodyLabel} model car. Cd ${aero.cd.toFixed(3)}, Cl ${aero.cl.toFixed(3)}. Illustrative flow field, not a CFD solve.`,
    body: bodyMarkup,
  });

  return { svg, partCount, aero, P };
}


  const PART_NOTES = {
    'car': '1:18 model car — lit subject mounted on the 4-pad turntable force balance.',
    'rear-window': 'Rear window & separation ridge — steeper backlight moves boundary-layer separation forward.',
    'diffuser': 'Underbody diffuser (0–15°) — accelerates floor exit flow and reduces aerodynamic lift (Cl).',
    'wake-rake': '9-probe wake rake & manometer — measures total-pressure deficit across the recirculating wake.',
    'wake': 'Recirculating wake — slow, low-pressure eddies behind the tail drive pressure drag (Cd).',
    'streamlines': 'Velocity-coloured smoke lines — brighter over accelerated roof flow, darker in the slow wake.',
    'fan': 'Axial inlet fan & honeycomb straightener — drives uniform freestream at 60–140 km/h.',
    'cd-gauge': 'Cd dial gauge (0.20–0.40) — needle tracks live Cd; lit arc marks the 90% prediction interval (±0.0245).',
    'cl-gauge': 'Cl dial gauge (-0.10 to +0.25) — responds directly to diffuser angle and rear-window separation.',
    'turntable': 'Graduated turntable balance — supports the 1:18 car and routes load-cell forces to the console.',
    'tunnel': 'Cutaway test section with X/Z tick rulers and exit collector frame.',
    'console': 'Instrument plinth with Cd/Cl dial gauges, knurled control knobs, and body-type selector.',
    'bench': 'Cast optical test bench on four levelled feet with serial plate and instrumentation conduit.'
  };

  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const target = {
    bodyType: 'fastback',
    windSpeedKmh: 110,
    rearAngleDeg: 24,
    diffuserAngleDeg: 9.5,
    streamlines: true,
    azimuth: 56,
    elevation: 28,
  };

  const smoothState = {
    windSpeedKmh: 110,
    rearAngleDeg: 24,
    diffuserAngleDeg: 9.5,
    azimuth: 56,
    elevation: 28,
  };

  let activeCase = 0;
  let tourOn = !reducedMotion;
  let tourTimer = 0;
  let fanAngle = 0;
  let flowPhase = 0;
  let hoveredPart = null;
  let dragging = false;
  let dragStartX = 0;
  let dragStartY = 0;
  let dragAz0 = 56;
  let dragEl0 = 28;
  let inView = true;
  let paused = false;

  const plateEl = document.querySelector('.iso-plate');
  const stageEl = document.querySelector('.iso-stage');
  const readoutEl = document.querySelector('[data-readout]');
  const inspectEl = document.getElementById('inspect-text');

  const speedEl = document.getElementById('ctrl-speed');
  const rearEl = document.getElementById('ctrl-rear');
  const diffEl = document.getElementById('ctrl-diff');
  const valSpeedEl = document.getElementById('val-speed');
  const valRearEl = document.getElementById('val-rear');
  const valDiffEl = document.getElementById('val-diff');

  const mCd = document.getElementById('m-cd');
  const mPi = document.getElementById('m-pi');
  const mCl = document.getElementById('m-cl');
  const mDiff = document.getElementById('m-diff');
  const mCda = document.getElementById('m-cda');
  const mArea = document.getElementById('m-area');
  const mPwr = document.getElementById('m-pwr');
  const mSpd = document.getElementById('m-spd');
  const mEv = document.getElementById('m-ev');

  const btnStream = document.getElementById('btn-stream');
  const btnTour = document.getElementById('btn-tour');
  const btnTheme = document.getElementById('btn-theme');
  const caseBtns = Array.from(document.querySelectorAll('[data-case]'));
  const bodyBtns = Array.from(document.querySelectorAll('[data-body]'));

  function syncControlsUI() {
    speedEl.value = String(target.windSpeedKmh);
    rearEl.value = String(target.rearAngleDeg);
    diffEl.value = String(target.diffuserAngleDeg);
    valSpeedEl.textContent = Math.round(target.windSpeedKmh) + ' km/h';
    valRearEl.textContent = Number(target.rearAngleDeg).toFixed(1) + '°';
    valDiffEl.textContent = Number(target.diffuserAngleDeg).toFixed(1) + '°';

    bodyBtns.forEach((b) => {
      const on = b.dataset.body === target.bodyType;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', String(on));
    });

    caseBtns.forEach((b, idx) => {
      const on = idx === activeCase;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', String(on));
    });

    btnStream.classList.toggle('is-active', target.streamlines);
    btnStream.setAttribute('aria-pressed', String(target.streamlines));
    btnStream.textContent = 'Streamlines: ' + (target.streamlines ? 'On' : 'Off');

    btnTour.classList.toggle('is-active', tourOn);
    btnTour.setAttribute('aria-pressed', String(tourOn));
    btnTour.textContent = 'Tour: ' + (tourOn ? 'On' : 'Off');
  }

  function renderFrame() {
    const res = buildScene(
      {
        bodyType: target.bodyType,
        windSpeedKmh: smoothState.windSpeedKmh,
        rearAngleDeg: smoothState.rearAngleDeg,
        diffuserAngleDeg: smoothState.diffuserAngleDeg,
        streamlines: target.streamlines,
      },
      {
        azimuth: smoothState.azimuth,
        elevation: smoothState.elevation,
        fanAngle,
        flowPhase,
        hoveredPart,
      }
    );

    stageEl.innerHTML = res.svg;
    const a = res.aero;
    readoutEl.textContent = a.caseLabel + ' · Cd ' + a.cd.toFixed(3) + ' · Cl ' + a.cl.toFixed(3);
    mCd.textContent = a.cd.toFixed(3);
    mPi.textContent = '90% PI ±' + a.pi90.toFixed(4);
    mCl.textContent = a.cl.toFixed(3);
    mDiff.textContent = 'Diffuser ' + a.diffuserAngleDeg.toFixed(1) + '°';
    mCda.textContent = a.cdA.toFixed(3) + ' m²';
    mArea.textContent = 'A = ' + a.displayAreaM2.toFixed(2) + ' m²';
    mPwr.textContent = a.aeroPowerKw.toFixed(2) + ' kW';
    mSpd.textContent = 'at ' + Math.round(a.windSpeedKmh) + ' km/h';
    mEv.textContent = (a.evRangeDeltaKm >= 0 ? '+' : '') + a.evRangeDeltaKm.toFixed(1) + ' km';
    return res;
  }

  function applyCase(idx, stopTour = false) {
    activeCase = ((idx % CASES.length) + CASES.length) % CASES.length;
    const c = CASES[activeCase].state;
    target.bodyType = c.bodyType;
    target.windSpeedKmh = c.windSpeedKmh;
    target.rearAngleDeg = c.rearAngleDeg;
    target.diffuserAngleDeg = c.diffuserAngleDeg;
    if (stopTour) tourOn = false;
    if (reducedMotion) {
      smoothState.windSpeedKmh = target.windSpeedKmh;
      smoothState.rearAngleDeg = target.rearAngleDeg;
      smoothState.diffuserAngleDeg = target.diffuserAngleDeg;
    }
    syncControlsUI();
    renderFrame();
  }

  caseBtns.forEach((b) => {
    b.addEventListener('click', () => applyCase(Number(b.dataset.case), true));
  });

  bodyBtns.forEach((b) => {
    b.addEventListener('click', () => {
      tourOn = false;
      activeCase = -1;
      target.bodyType = b.dataset.body;
      syncControlsUI();
      renderFrame();
    });
  });

  speedEl.addEventListener('input', () => {
    tourOn = false;
    target.windSpeedKmh = Number(speedEl.value);
    syncControlsUI();
    if (reducedMotion) { smoothState.windSpeedKmh = target.windSpeedKmh; renderFrame(); }
  });

  rearEl.addEventListener('input', () => {
    tourOn = false;
    activeCase = -1;
    target.rearAngleDeg = Number(rearEl.value);
    syncControlsUI();
    if (reducedMotion) { smoothState.rearAngleDeg = target.rearAngleDeg; renderFrame(); }
  });

  diffEl.addEventListener('input', () => {
    tourOn = false;
    activeCase = -1;
    target.diffuserAngleDeg = Number(diffEl.value);
    syncControlsUI();
    if (reducedMotion) { smoothState.diffuserAngleDeg = target.diffuserAngleDeg; renderFrame(); }
  });

  btnStream.addEventListener('click', () => {
    target.streamlines = !target.streamlines;
    syncControlsUI();
    renderFrame();
  });

  btnTour.addEventListener('click', () => {
    tourOn = !tourOn;
    tourTimer = 0;
    syncControlsUI();
  });

  btnTheme.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    document.body.setAttribute('data-theme', next);
    btnTheme.textContent = next === 'dark' ? 'Light' : 'Dark';
  });

  stageEl.addEventListener('pointerdown', (e) => {
    dragging = true;
    tourOn = false;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragAz0 = target.azimuth;
    dragEl0 = target.elevation;
    syncControlsUI();
    stageEl.setPointerCapture && stageEl.setPointerCapture(e.pointerId);
  });

  window.addEventListener('pointermove', (e) => {
    if (dragging) {
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      target.azimuth = Math.max(40, Math.min(72, dragAz0 - dx * 0.14));
      target.elevation = Math.max(20, Math.min(38, dragEl0 + dy * 0.08));
      if (reducedMotion) {
        smoothState.azimuth = target.azimuth;
        smoothState.elevation = target.elevation;
        renderFrame();
      }
      return;
    }
    const g = e.target && e.target.closest ? e.target.closest('[data-group]') : null;
    const part = g ? g.getAttribute('data-group') : null;
    if (part !== hoveredPart) {
      hoveredPart = part;
      if (part && PART_NOTES[part]) {
        inspectEl.innerHTML = '<strong>' + part.replace('-', ' ') + ':</strong> ' + PART_NOTES[part];
      } else {
        inspectEl.innerHTML = '<strong>Inspect:</strong> Hover any part of the rig or drag horizontally to orbit the test section.';
      }
      if (reducedMotion) renderFrame();
    }
  });

  window.addEventListener('pointerup', () => { dragging = false; });
  stageEl.addEventListener('pointerleave', () => {
    if (!dragging && hoveredPart) {
      hoveredPart = null;
      inspectEl.innerHTML = '<strong>Inspect:</strong> Hover any part of the rig or drag horizontally to orbit the test section.';
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      applyCase((activeCase < 0 ? 0 : activeCase) + 1, true);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      applyCase((activeCase < 0 ? 0 : activeCase) - 1, true);
    } else if (e.key === ' ') {
      e.preventDefault();
      tourOn = !tourOn;
      syncControlsUI();
    }
  });

  if ('IntersectionObserver' in window) {
    new IntersectionObserver((entries) => {
      inView = entries[0] ? entries[0].isIntersecting : true;
    }).observe(plateEl);
  }

  window.__aeroRig = {
    setCase(idx) {
      tourOn = false;
      activeCase = idx;
      const c = CASES[idx].state;
      Object.assign(target, c);
      smoothState.windSpeedKmh = c.windSpeedKmh;
      smoothState.rearAngleDeg = c.rearAngleDeg;
      smoothState.diffuserAngleDeg = c.diffuserAngleDeg;
      syncControlsUI();
      return renderFrame().aero;
    },
    setState(patch) {
      tourOn = false;
      Object.assign(target, patch);
      if (patch.windSpeedKmh != null) smoothState.windSpeedKmh = patch.windSpeedKmh;
      if (patch.rearAngleDeg != null) smoothState.rearAngleDeg = patch.rearAngleDeg;
      if (patch.diffuserAngleDeg != null) smoothState.diffuserAngleDeg = patch.diffuserAngleDeg;
      if (patch.azimuth != null) smoothState.azimuth = patch.azimuth;
      if (patch.elevation != null) smoothState.elevation = patch.elevation;
      syncControlsUI();
      return renderFrame().aero;
    },
    pause(v = true) { paused = v; },
    getAero() {
      return evaluateAero(target);
    }
  };

  let lastT = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastT) / 1000));
    lastT = now;

    if (inView && !reducedMotion && !paused) {
      if (tourOn) {
        tourTimer += dt;
        if (tourTimer >= 4.2) {
          tourTimer = 0;
          applyCase(activeCase + 1, false);
        }
      }

      const k = 1 - Math.exp(-dt * 6.5);
      smoothState.windSpeedKmh += (target.windSpeedKmh - smoothState.windSpeedKmh) * k;
      smoothState.rearAngleDeg += (target.rearAngleDeg - smoothState.rearAngleDeg) * k;
      smoothState.diffuserAngleDeg += (target.diffuserAngleDeg - smoothState.diffuserAngleDeg) * k;
      smoothState.azimuth += (target.azimuth - smoothState.azimuth) * k;
      smoothState.elevation += (target.elevation - smoothState.elevation) * k;

      const speedScale = smoothState.windSpeedKmh / 110;
      fanAngle += dt * 3.8 * speedScale;
      flowPhase += dt * 1.15 * speedScale;

      renderFrame();
    }
    requestAnimationFrame(tick);
  }

  syncControlsUI();
  renderFrame();
  if (!reducedMotion) requestAnimationFrame(tick);
})();
</script>
</body>
</html>
